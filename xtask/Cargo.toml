[package]
publish = false
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
# The gateway request types, for checking them against the vendored fragments.
# Without default features, so that the generated `onboarding` module is not part
# of the tool that generates it: a broken generated file must not stop
# `cargo xtask codegen` from replacing it.
achq = { path = "../achq", default-features = false, features = ["ureq", "rustls"] }
time = "0.3.55"
heck = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.1"
toml = "1.1.7"
ureq = "3.4.2"
