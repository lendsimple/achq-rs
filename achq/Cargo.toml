[package]
name = "achq"
description = "A typed client for the ACHQ (SpeedChex) bank payments API, for native and WebAssembly targets."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/achq"
keywords = ["achq", "payments", "ach", "bank", "wasm"]
categories = ["api-bindings", "finance", "wasm"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Exact: the derive's output calls this crate's hidden internals.
achq-derive = { version = "=0.1.0", path = "../achq-derive" }
bon = "3.10.2"
csv = "1.4.0"
rust_decimal = { version = "1.43.0", features = ["macros"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["parsing", "formatting", "macros"] }

[dev-dependencies]
insta = "1.49.0"
pretty_assertions = "1.4.1"
trybuild = "1.0.122"

[features]
default = ["onboarding"]
## The onboarding API: industry categories now, merchant and fee profile
## creation in a later release.
onboarding = []
